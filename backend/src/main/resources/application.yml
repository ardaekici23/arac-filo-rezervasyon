server:
  port: 8080

spring:
  application:
    name: filo-rezervasyon
  datasource:
    url: jdbc:postgresql://localhost:5432/filo_rezervasyon
    username: filo_user
    password: change_me
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operationsSorter: method

app:
  cors:
    allowed-origins: http://localhost:5173
